[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coil-efficiency-bench"
dynamic = ["version"]
description = "Offline, stdlib-only paired analysis of baseline vs candidate motor-efficiency measurements (paired Student's t interval)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jean-François Brisson" }]
keywords = ["motor-efficiency", "paired-comparison", "confidence-interval", "measurement", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Repository = "https://github.com/sparkainlp-x/coil-efficiency-bench"

[project.scripts]
coil-bench = "coil_bench:main"

[tool.setuptools]
py-modules = ["coil_bench"]

[tool.setuptools.dynamic]
version = { attr = "coil_bench.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
branch = true
include = ["coil_bench.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
