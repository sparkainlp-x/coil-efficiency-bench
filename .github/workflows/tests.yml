name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # SciPy is only used by an optional test that cross-checks the paired t interval.
      - run: python -m pip install --upgrade pip ruff "coverage[toml]" scipy
      - name: Lint
        run: ruff check .
      - name: Tests with coverage (fails under 90%)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=90
      - name: Sample analysis runs
        run: python coil_bench.py data/synthetic_measurements.csv --threshold-pp 2.0
      - name: pip install and run the console script
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          coil-bench --version
          cp "$GITHUB_WORKSPACE/data/synthetic_measurements.csv" copy.csv
          coil-bench copy.csv --threshold-pp 2.0 | tee out.txt
          grep -q "NOTICE: Synthetic sample data" out.txt
          coil-bench copy.csv --threshold-pp 2.0 --json > out.json
          python -c "import json; assert json.load(open('out.json'))['synthetic_sample'] is True"
